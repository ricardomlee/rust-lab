[package]
name = "wasm_lab"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
core = { path = "../core" }

serde_json = "1"

# Note: wasm-opt is run by `wasm-pack build --release` when available.
# It is enabled by default and fetched from binaryen GitHub releases.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
