<!doctype html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <title>Rust Lab · Rust + WASM 实验室</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一个用于探索 Rust + WebAssembly 能力边界的小型实验场，所有计算可在浏览器内完成。" />
  <meta name="color-scheme" content="dark" />

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🦀%3C/text%3E%3C/svg%3E" />

  <!-- Tailwind CDN（保持轻量，构建期无需打包工具） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            ink: {
              950: '#070a13',
              900: '#0b101c',
              850: '#0f1626',
              800: '#141d31',
              700: '#1c2841',
              600: '#27365a',
            },
          },
        },
      },
    };
  </script>

  <style>
    html,
    body {
      height: 100%;
      background: radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.10), transparent 40%),
        radial-gradient(circle at 90% 0%, rgba(168, 85, 247, 0.10), transparent 45%),
        radial-gradient(circle at 60% 100%, rgba(251, 146, 60, 0.08), transparent 45%),
        #070a13;
      color: #e5e7eb;
    }

    .glass {
      background: rgba(20, 29, 49, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .glass-soft {
      background: rgba(15, 22, 38, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.10);
    }

    .gradient-text {
      background: linear-gradient(135deg, #f97316, #f59e0b 35%, #38bdf8 70%, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.55rem;
      font-size: 0.82rem;
      color: #cbd5e1;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      user-select: none;
    }

    .nav-item:hover {
      color: #f8fafc;
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.18);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(168, 85, 247, 0.18));
      color: #fff;
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 4px 18px -8px rgba(56, 189, 248, 0.55);
    }

    .nav-emoji {
      width: 1.25rem;
      text-align: center;
    }

    .group-title {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      color: #64748b;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      margin-top: 0.85rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(148, 163, 184, 0.08);
      color: #cbd5e1;
    }

    .pill-emerald {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.10);
      color: #6ee7b7;
    }

    .pill-sky {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.10);
      color: #7dd3fc;
    }

    .pill-amber {
      border-color: rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.10);
      color: #fcd34d;
    }

    .pill-rose {
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.10);
      color: #fda4af;
    }

    .pill-violet {
      border-color: rgba(168, 85, 247, 0.4);
      background: rgba(168, 85, 247, 0.10);
      color: #d8b4fe;
    }

    .field {
      width: 100%;
      background: rgba(7, 10, 19, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 0.6rem;
      padding: 0.55rem 0.75rem;
      color: #e5e7eb;
      font-size: 0.85rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field:focus {
      outline: none;
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .field[readonly] {
      background: rgba(7, 10, 19, 0.4);
      color: #94a3b8;
    }

    .label {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.25rem;
      display: block;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 1.1rem;
      border-radius: 0.6rem;
      font-weight: 600;
      font-size: 0.875rem;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #052e2b;
      border: 1px solid rgba(16, 185, 129, 0.6);
      box-shadow: 0 6px 22px -10px rgba(16, 185, 129, 0.7);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px -12px rgba(16, 185, 129, 0.8);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .quick-chip {
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.72rem;
      color: #a5f3fc;
      border: 1px solid rgba(34, 211, 238, 0.35);
      background: rgba(34, 211, 238, 0.06);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quick-chip:hover {
      background: rgba(34, 211, 238, 0.18);
      color: #f0fdff;
      border-color: rgba(34, 211, 238, 0.6);
    }

    .compare-card {
      border-radius: 0.85rem;
      padding: 1rem 1.1rem;
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(11, 16, 28, 0.7);
    }

    .compare-card h3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.55rem;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem;
      margin-top: 0.6rem;
      font-size: 0.75rem;
    }

    .stat-grid span {
      color: #94a3b8;
    }

    .stat-grid b {
      color: #e2e8f0;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    pre.code-block {
      background: rgba(2, 6, 14, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.10);
      border-radius: 0.6rem;
      padding: 0.7rem 0.85rem;
      font-size: 0.78rem;
      color: #a7f3d0;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
      max-height: 280px;
      overflow: auto;
    }

    .swatch {
      border-radius: 0.6rem;
      height: 88px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
    }

    .palette-strip {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 0.35rem;
    }

    .palette-strip > div {
      height: 48px;
      border-radius: 0.45rem;
      border: 1px solid rgba(148, 163, 184, 0.15);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 0.62rem;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.6);
      padding-bottom: 0.15rem;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }

    .spinner {
      display: inline-block;
      width: 0.85rem;
      height: 0.85rem;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 999px;
      display: inline-block;
    }

    .dot-on {
      background: #34d399;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.7);
    }

    .dot-off {
      background: #94a3b8;
    }

    .dot-warn {
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
    }

    /* Custom scrollbar */
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.18); border-radius: 999px; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.32); }

    /* Mobile sidebar */
    @media (max-width: 768px) {
      aside.app-sidebar {
        position: fixed;
        z-index: 30;
        left: 0;
        top: 0;
        bottom: 0;
        width: 17rem;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }
      aside.app-sidebar.open { transform: translateX(0); }
      .mobile-toggle { display: inline-flex !important; }
    }
  </style>
</head>

<body class="font-sans antialiased">
  <div class="flex h-screen w-full overflow-hidden">

    <!-- Sidebar -->
    <aside class="app-sidebar w-64 shrink-0 glass flex flex-col gap-1 px-3 py-4 overflow-y-auto">
      <div class="px-3 pb-3 mb-1 border-b border-white/5">
        <div class="text-xl font-bold gradient-text">🦀 Rust Lab</div>
        <div class="text-[11px] text-slate-400 mt-0.5">Rust + WebAssembly 实验场</div>
      </div>

      <div id="experiments" class="flex flex-col gap-0.5"></div>

      <div class="mt-auto px-3 pt-4 border-t border-white/5 text-[11px] text-slate-500 space-y-1">
        <div class="flex items-center gap-2">
          <span id="api-dot" class="dot dot-off"></span>
          <span>API: <span id="api-status">检测中…</span></span>
        </div>
        <div class="flex items-center gap-2">
          <span id="wasm-dot" class="dot dot-off"></span>
          <span>WASM: <span id="wasm-status">加载中…</span></span>
        </div>
        <div class="pt-1">
          <a class="hover:text-sky-300" href="https://github.com/ricardomlee/rust-lab" target="_blank" rel="noreferrer">GitHub ↗</a>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto">
      <div class="max-w-5xl mx-auto px-5 md:px-8 py-6 md:py-10">
        <button id="mobile-toggle" class="mobile-toggle hidden mb-3 px-3 py-1.5 text-sm rounded-md glass-soft" type="button">☰ 菜单</button>

        <header class="mb-6">
          <div class="flex items-center gap-2 mb-1">
            <span id="exp-emoji" class="text-2xl">🧪</span>
            <h1 id="title" class="text-2xl md:text-3xl font-bold">Rust 实验室</h1>
            <span id="exp-mode-pill" class="pill pill-sky hidden">API + WASM</span>
          </div>
          <p id="help" class="text-sm text-slate-400 leading-relaxed"></p>
        </header>

        <section id="form" class="glass rounded-2xl p-5 md:p-6 mb-6 space-y-4">
          <div id="quick-examples" class="flex flex-wrap gap-2 hidden"></div>

          <div id="dynamic-fields" class="grid gap-3"></div>

          <div class="flex flex-wrap items-center gap-3">
            <button id="run" class="btn-primary" type="button">
              <span id="run-label">▶ 运行实验</span>
            </button>
            <div class="flex items-center gap-2 text-xs text-slate-400">
              <label for="runs" class="label !mb-0 !uppercase">runs</label>
              <input id="runs" type="number" min="1" max="1000" value="1"
                class="field !w-20 !py-1 text-center" />
              <span>次平均</span>
            </div>
          </div>
        </section>

        <section id="result" class="space-y-4"></section>
      </div>
    </main>
  </div>

  <script src="./app.js"></script>
</body>

</html>
